# The Playground's projects, in the order they're listed. See
# PlaygroundProject for what each key means. About page content for a project
# lives in config/playground/about/<slug>.yml.

- slug: byte
  title: "Byte & Buddy"
  year: 2026
  access: :owner
  gate: :byte_access?
  path: :byte_root
  subdomain: :byte
  showcase: true
  description: "A household chat app with an AI assistant inside it. Buddy turns plain sentences into real tool calls: timers, reminders, routines, lists, check-ins, and things worth remembering."

- slug: jarvis
  title: "Jarvis"
  year: 2022
  access: :owner
  showcase: true
  description: "The command layer under everything here. One parser takes text or voice from Alexa, SMS, an iPhone Shortcut, a dashboard, or chat, and turns it into actions."

- slug: system
  title: "System Hub"
  year: 2026
  access: :owner
  path: :system
  showcase: true
  description: "The control room for running this site in production: AI spend, error reports, live database and socket connections, and the queue of things the assistant was asked for and couldn't do yet."

- slug: agenda
  title: "Agenda"
  year: 2026
  access: :guest
  path: :day
  description: "An offline-first calendar PWA. Custom scheduling, day, week, and month views, travel-time chaining, fully connected to Jil for event starts, ends, and triggering pre-event scripts."

- slug: chores
  title: "Chores"
  year: 2026
  access: :guest
  path: :chores
  description: "Recurring chore tracker with fully custom recurring chores, reminders, and multiples. Includes point for streaks, goals, multipliers, and household sharing."

- slug: interviews
  title: "Interview Tracker"
  year: 2026
  access: :account
  path: :interviews
  description: "Track every interaction with each potential company and taking notes for each one."

- slug: timers
  title: "Timers"
  year: 2026
  access: :account
  path: :timers
  description: "Timers, counters, alarms, trackers. Multiple on one page and saved templates for re-use."

- slug: board-games
  title: "Board Games"
  year: 2026
  access: :account
  path: :games
  description: "Score keeper for game night that runs on one phone beside the table. Works offline, resumes a game in progress, and keeps play history and stats per game."

- slug: list-builders
  title: "List Builders"
  year: 2026
  access: :guest
  path: :list_builders
  description: "Touch panels for a shared list. Tap an item to put it on the list, and track how many are left at home, with low and out-of-stock flags. Syncs live across devices."

- slug: meal-builder
  title: "Meal Builder"
  year: 2025
  access: :guest
  path: :meal_builders
  description: "Tap together a meal from your usual foods, add one-off items, and log it with a running calorie total. You can backdate the meal to when you ate it."

- slug: custom-charts
  title: "Custom Charts"
  year: 2026
  access: :guest
  path: :custom_charts
  description: "Using ActionEvent data that has been logged, configure fully custom charts and graphs and dashboards for visualizing data."

- slug: mtg-glossary
  title: "MTG Glossary"
  year: 2026
  access: :public
  path: :mtg_glossary
  description: "Fuzzy search across every keyword action and ability in the Magic: The Gathering comprehensive rules."

- slug: lorcana-glossary
  title: "Lorcana Glossary"
  year: 2026
  access: :public
  path: :lorcana_glossary
  description: "The same search, over Disney Lorcana's keywords and rules terms."

- slug: inventory
  title: "Inventory"
  year: 2025
  access: :guest
  path: :inventory
  description: "Nested boxes for tracking what's packed where, with search that reaches all the way down. Connect QR labels to sticker onto boxes to quickly scan and see what's inside or find which room and box a specific item is located in."

- slug: jil
  title: "J.I.L."
  year: 2024
