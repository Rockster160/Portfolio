test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Use rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
amazon:
  service: S3
  access_key_id: <%= ENV["PORTFOLIO_S3_ACCESS_KEY"] %>
  secret_access_key: <%= ENV["PORTFOLIO_S3_SECRET_KEY"] %>
  region: us-east-1
  bucket: ardesian-storage

# Disk in test, and this cannot be done by config.active_storage.service: the
# attachment pins its own service (`has_one_attached :mail_blob, service:
# :s3_emails` on Email), so the test setting never reaches it and any spec that
# attaches one writes into the real mail bucket. Same service NAME, local root.
#
# The whole block swaps, rather than one `service:` line: every key here is
# handed to the adapter, and S3Service passes what it does not recognize to
# Aws::S3::Resource, which rejects a stray `root:` outright.
s3_emails:
<% if Rails.env.test? %>
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>
<% else %>
  service: S3
  access_key_id: <%= ENV["PORTFOLIO_S3_ACCESS_KEY"] %>
  secret_access_key: <%= ENV["PORTFOLIO_S3_SECRET_KEY"] %>
  region: us-east-1
  bucket: ardesian-emails
<% end %>

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket

# Use rails credentials:edit to set the Azure Storage secret (as azure_storage:storage_access_key)
# microsoft:
#   service: AzureStorage
#   storage_account_name: your_account_name
#   storage_access_key: <%= Rails.application.credentials.dig(:azure_storage, :storage_access_key) %>
#   container: your_container_name

# mirror:
#   service: Mirror
#   primary: local
#   mirrors: [ amazon, google, microsoft ]
