      fill="none"
      stroke="#9DF7FF"
      stroke-width="7"
      stroke-linecap="round"
      opacity="0.72"/>

    <path id="right-rim"
      d="M369 199 C379 252 395 292 429 334 C450 360 442 390 406 408"
      fill="none"
      stroke="#2D9DFF"
      stroke-width="6"
      stroke-linecap="round"
