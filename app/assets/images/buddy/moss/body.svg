        C 194 129 156 154 145 202
        C 135 251 122 291 91 331
        C 68 361 75 391 115 410
        C 149 426 187 426 220 420
        C 244 416 268 416 292 420
        C 325 426 363 426 397 410
        C 437 391 444 361 421 331
        C 390 291 377 251 367 202
        C 356 154 318 129 256 129
        Z"
      fill="url(#innerDepth)"
      opacity="0.94"/>

    <g id="internal-depth-shapes" clip-path="url(#bodyClip)">
      <ellipse cx="256" cy="350" rx="171" ry="72"
        fill="#001A88"
        opacity="0.14"/>
      <ellipse cx="256" cy="386" rx="150" ry="47"
        fill="#43E0FF"
        opacity="0.10"/>
      <path d="
        M 93 344
        C 143 309 190 321 232 350
        C 278 382 334 386 419 339
        C 401 402 348 421 294 414
        C 269 411 243 411 218 414
        C 163 422 112 402 93 344
        Z"
