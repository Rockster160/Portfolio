<svg xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="title desc">
  <title id="title">Byte idle body v2</title>
  <desc id="desc">
    Wide, low, blob-shaped neutral body for Byte. Face, arms, props, effects,
    droplets, and ground shadow are intentionally excluded.
  </desc>

  <defs>
    <linearGradient id="bodyFill" x1="0.18" y1="0.04" x2="0.82" y2="0.96">
      <stop offset="0" stop-color="#43E0FF" stop-opacity="0.98"/>
      <stop offset="0.22" stop-color="#168EFF" stop-opacity="0.98"/>
      <stop offset="0.58" stop-color="#0160FF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#0034C9" stop-opacity="0.98"/>
    </linearGradient>

    <radialGradient id="innerDepth" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#78ECFF" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#0759E8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#001A82" stop-opacity="0.48"/>
    </radialGradient>

    <linearGradient id="rimLight" x1="0.06" y1="0.05" x2="0.94" y2="0.95">
      <stop offset="0" stop-color="#C8FBFF" stop-opacity="0.98"/>
      <stop offset="0.34" stop-color="#43E0FF" stop-opacity="0.70"/>
      <stop offset="0.74" stop-color="#0F68FF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8A6BFF" stop-opacity="0.42"/>
    </linearGradient>

    <linearGradient id="baseGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43E0FF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#65F2FF" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#8A6BFF" stop-opacity="0.18"/>
    </linearGradient>

    <filter id="crestGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="wide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="tight"/>
      <feMerge>
        <feMergeNode in="wide"/>
        <feMergeNode in="tight"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="highlightBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <clipPath id="bodyClip">
      <path d="
        M 256 118
        C 185 118 143 146 132 198
        C 122 246 111 286 80 326
        C 51 365 64 407 111 428
        C 143 442 184 444 220 438
        C 244 434 268 434 292 438
        C 328 444 369 442 401 428
        C 448 407 461 365 432 326
        C 401 286 390 246 380 198
        C 369 146 327 118 256 118
        Z"/>
    </clipPath>
  </defs>

  <g id="byte-body-idle-v2">
    <path id="body-shell"
      d="
        M 256 118
        C 185 118 143 146 132 198
        C 122 246 111 286 80 326
        C 51 365 64 407 111 428
        C 143 442 184 444 220 438
        C 244 434 268 434 292 438
        C 328 444 369 442 401 428
        C 448 407 461 365 432 326
        C 401 286 390 246 380 198
        C 369 146 327 118 256 118
        Z"
      fill="url(#bodyFill)"
      stroke="url(#rimLight)"
      stroke-width="9"
      stroke-linejoin="round"/>

    <path id="body-depth"
