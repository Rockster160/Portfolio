    </g>

    <g id="circuit-crest"
      fill="none"
      stroke="#E9FFFF"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#crestGlow)">
      <path d="M256 264 V179"/>
      <circle cx="256" cy="163" r="16"/>
      <path d="M256 239 L211 205 V187"/>
      <circle cx="211" cy="171" r="15"/>
      <path d="M256 239 L301 205 V187"/>
      <circle cx="301" cy="171" r="15"/>
    </g>

    <g id="crest-cyan-core"
      fill="none"
      stroke="#8CF7FF"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.95">
      <path d="M256 264 V179"/>
      <circle cx="256" cy="163" r="16"/>
      <path d="M256 239 L211 205 V187"/>
      <circle cx="211" cy="171" r="15"/>
      <path d="M256 239 L301 205 V187"/>
      <circle cx="301" cy="171" r="15"/>
    </g>
  </g>
</svg>
