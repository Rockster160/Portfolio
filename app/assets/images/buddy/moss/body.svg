    <g id="specular-highlights" clip-path="url(#bodyClip)">
      <path d="
        M 158 165
        C 178 141 207 130 236 130
        C 210 143 191 162 179 189
        C 170 208 147 202 158 165
        Z"
        fill="#FFFFFF"
        opacity="0.86"
        filter="url(#highlightBlur)"/>

      <path d="M145 192 C154 172 164 157 179 145"
        fill="none"
        stroke="#D8FCFF"
        stroke-width="13"
        stroke-linecap="round"
        opacity="0.68"/>

      <path d="M116 332 C126 313 141 302 159 297"
        fill="none"
        stroke="#B7F9FF"
        stroke-width="11"
        stroke-linecap="round"
        opacity="0.56"/>

      <path d="M91 365 C102 347 113 336 127 329"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="7"
        stroke-linecap="round"
        opacity="0.58"/>

      <ellipse cx="205" cy="142" rx="19" ry="8"
        transform="rotate(-18 205 142)"
        fill="#DFFFFF"
        opacity="0.40"/>

      <ellipse cx="330" cy="151" rx="14" ry="7"
        transform="rotate(25 330 151)"
        fill="#65EEFF"
        opacity="0.22"/>

      <path d="M143 391 C168 403 191 403 218 399"
        fill="none"
        stroke="#78F1FF"
        stroke-width="9"
        stroke-linecap="round"
