<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Face Thinking</title>
  <defs>
    <radialGradient id="eyeHighlight" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDF8FF"/>
    </radialGradient>
  </defs>
  <g id="eyes_thinking">
    <ellipse cx="184" cy="252" rx="32" ry="38" fill="#090B22"/>
    <circle  cx="174" cy="234" r="11" fill="url(#eyeHighlight)"/>
    <circle  cx="166" cy="252" r="4"  fill="#FFFFFF"/>
    <ellipse cx="320" cy="240" rx="32" ry="38" fill="#090B22"/>
    <circle  cx="310" cy="222" r="11" fill="url(#eyeHighlight)"/>
    <circle  cx="302" cy="240" r="4"  fill="#FFFFFF"/>
  </g>
  <g id="mouth_pensive">
    <!-- Slight upward slant left-to-right + tiny middle bump so the
         mouth reads "hmm..." instead of the harsh dead-flat line. -->
    <path d="M222 330 Q248 322 268 322 T292 316"
      fill="none" stroke="#11111D" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g id="extra_blush">
    <ellipse cx="154" cy="300" rx="18" ry="11" fill="#B68BFF" opacity="0.35"/>
    <ellipse cx="358" cy="300" rx="18" ry="11" fill="#B68BFF" opacity="0.35"/>
  </g>
</svg>
