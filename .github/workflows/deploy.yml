# sudo nano /etc/systemd/system/puma_portfolio_production.service
# sudo systemctl daemon-reload && sudo /bin/systemctl restart puma_portfolio_production
# sudo /bin/systemctl start puma_portfolio_production
# journalctl -r -u puma_portfolio_production.service
# systemctl status puma_portfolio_production.service
# check syntax error with `sc`
# (local) bundle exec cap production deploy

# sidekiq uses default systemd service
# sudo systemctl restart sidekiq.service
# sudo systemctl start sidekiq.service
# sudo systemctl enable sidekiq.service

name: Deploy after merge

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Get Commit Details
      id: commit_info
      run: |
        merge_sha=$(git rev-parse HEAD)
        sha=$(git rev-list --no-merges -n 1 HEAD)
        author=$(git log -1 --pretty=format:'%an' $sha)
        message=$(git log -1 --pretty=format:'%s' $sha)
        echo "::set-output name=merge::$merge_sha"
        echo "::set-output name=sha::$sha"
        echo "::set-output name=author::$author"
        echo "::set-output name=message::$message"

    - name: Begin Deploy
      run: |
        curl -X POST -H "Authorization: Bearer ${{ secrets.PORTFOLIO_ACCESS_KEY }}" \
        -d "id=deploy&deploy=start&merge=${{ steps.commit_info.outputs.merge }}&sha=${{ steps.commit_info.outputs.sha }}&author=${{ steps.commit_info.outputs.author }}&message=${{ steps.commit_info.outputs.message }}" \
        https://ardesian.com/jil/trigger/monitor

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2.2

    - name: Install dependencies
      run: |
        gem install bundler
        bundle install

    - name: Deploy to Digital Ocean
      env:
        SSH_PRIVATE_KEY: /tmp/ssh_key
      run: |
        eval `ssh-agent -s` # Manually start ssh-agent
        mkdir -p /home/runner/.ssh # /home/runner is the Github Action directory
        ssh-keyscan 165.227.15.235 >> /home/runner/.ssh/known_hosts
        echo "${{ secrets.PORTFOLIO_DEPLOY_SSH_KEY }}" > /home/runner/.ssh/github_actions
        chmod 600 /home/runner/.ssh/github_actions
        ssh-agent -a $SSH_PRIVATE_KEY > /dev/null
        ssh-add /home/runner/.ssh/github_actions
        bundle exec cap production deploy

    # A deploy reports success from TWO places, on purpose, and neither is
    # reliable alone. This hook knows the sha and the commit message but races
    # cap restarting Puma, so it 502s some of the time. The app's own `startup`
    # Jil task fires `monitor` with `deploy: "success"` once the new Rails is
    # genuinely up — the honest signal, and what flips the Deploy ActionEvent —
    # but it carries no sha, and it fires once per Puma worker.
    #
    # So a single deploy can emit three signals within a few seconds (prod
    # 1320/1322/1323 were exactly that). Buddy::WatchMatcher::DEBOUNCE_WINDOWS
    # collapses them, keeping the first — which is usually this one, and it's
    # the richest. Left un-retried for the same reason: if it loses the race,
    # startup covers it.
    - name: Finish Deploy
      run: |
        curl -X POST -H "Authorization: Bearer ${{ secrets.PORTFOLIO_ACCESS_KEY }}" \
        -d "id=deploy&deploy=finished&merge=${{ steps.commit_info.outputs.merge }}&sha=${{ steps.commit_info.outputs.sha }}&author=${{ steps.commit_info.outputs.author }}&message=${{ steps.commit_info.outputs.message }}" \
        https://ardesian.com/jil/trigger/deploy

    # This one is NOT optional and has no fallback: a deploy that died never
    # boots the new Rails, so the `startup` trigger never fires and this curl is
    # the only thing that can report it. It races the same restart, so retry
    # until Rails answers — but never fail the job over a lost ping.
    - name: Handle Deploy Failure
      if: failure()
      run: |
        curl -X POST -H "Authorization: Bearer ${{ secrets.PORTFOLIO_ACCESS_KEY }}" \
        --retry 10 --retry-delay 6 --retry-all-errors --fail --silent --show-error \
        -d "id=deploy&deploy=failed&sha=${{ steps.commit_info.outputs.sha }}" \
        https://ardesian.com/jil/trigger/monitor \
        || echo "::warning::deploy-failed ping never landed — Rails unreachable after retries"
